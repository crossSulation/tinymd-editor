[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }

# Disabled: recurring rustc 1.96.0 ICE ("no entry found for key" in
# rustc_metadata::rmeta::encoder::encode_metadata, a known incremental-
# compilation lint-level-encoding bug) hit repeatedly during
# `cargo build --target aarch64-linux-android` -- confirmed directly,
# reproduced twice, cleared by deleting the incremental cache each time but
# recurred on a later rebuild. This crate (app_lib) is tiny -- the dominant
# cost of any Android build is dependency compilation (tauri/wry/etc.),
# which this doesn't affect -- so disabling incremental here trades a
# negligible amount of rebuild speed for not hitting this ICE again.
[profile.dev]
incremental = false
